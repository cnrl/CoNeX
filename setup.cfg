[bumpversion]
current_version = 0.1.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:conex/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs
# Existing tree predates a style gate; these codes are ignored so CI passes
# without mass-editing code. Tighten per-file as the code is touched.
extend-ignore = E124, E203, E222, E225, E231, E302, E303, E501, E741, F401, F403, F405, F541, W291, W293
[tool:pytest]
collect_ignore = ['setup.py']
